[alembic]
# Path to migration scripts
script_location = migrations
# DB URL – will be overridden at runtime by env var
sqlalchemy.url = postgresql+asyncpg://openrun:iamraderex@postgres:5432/openrun

[log]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
