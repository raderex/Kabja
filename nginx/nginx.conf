# nginx/nginx.conf
# ═══════════════════════════════════════════════════════════════════════════
#  KTM School Bus Tracker — Production Nginx Configuration
#
#  Key decisions:
#  • WebSocket Upgrade headers correctly propagated
#  • proxy_read_timeout / proxy_send_timeout = 3600s (1 hour)
#    → prevents bus tracking WS from dropping on idle 4G connections
#  • Rate limiting on GPS and OTP endpoints
#  • Security headers (HSTS, CSP, X-Frame-Options)
#  • HTTP/2 on HTTPS for multiplexed API calls
# ═══════════════════════════════════════════════════════════════════════════

# ── Global ─────────────────────────────────────────────────────────────────
worker_processes      auto;
worker_rlimit_nofile  65535;
error_log             /var/log/nginx/error.log warn;
pid                   /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;   # hide Nginx version

    # ── Compression ────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json
                      application/javascript text/xml application/xml
                      application/xml+rss text/javascript;

    # ── Upstream — FastAPI ─────────────────────────────────────────────────
    upstream api_backend {
        server          api:8000;
        keepalive       32;
        keepalive_time  1h;
        keepalive_requests 1000;
    }

    # ── Rate limiting zones ────────────────────────────────────────────────
    # GPS endpoint: max 20 req/s per IP (5 buses × 4 pings/s headroom)
    limit_req_zone  $binary_remote_addr  zone=gps_limit:10m   rate=20r/s;

    # OTP endpoint: max 3 req/min per IP (anti-spam)
    limit_req_zone  $binary_remote_addr  zone=otp_limit:10m   rate=3r/m;

    # General API: 100 req/s per IP
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m   rate=100r/s;

    # ── WebSocket connection map ───────────────────────────────────────────
    # Maps the Upgrade header to the correct proxy value.
    # This is the #1 configuration mistake for WebSocket newcomers.
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ""        close;
    }

    # ── HTTP server (port 80)
    # ──────────────────────────────────────────────────────────────────────────
    #  Cloudflared terminates TLS externally.
    #  Nginx only needs to listen on HTTP 80 internally and proxy to FastAPI.
    #  DO NOT add SSL here — it will crash because there are no certs in local dev.
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        # ── Security headers (Cloudflared sets HSTS externally) ───────────────
        add_header  X-Content-Type-Options     "nosniff"                        always;
        add_header  X-Frame-Options            "DENY"                           always;
        add_header  X-XSS-Protection           "1; mode=block"                  always;
        add_header  Referrer-Policy            "strict-origin-when-cross-origin" always;

        # ── Client body limits ────────────────────────────────────────────────
        client_max_body_size    1m;
        client_body_buffer_size 16k;

        # ══════════════════════════════════════════════════════════════════
        #  WebSocket — /ws/{route_id}?token=<JWT>
        #
        #  Critical settings explained:
        #  • proxy_http_version 1.1       — HTTP/1.1 required for Upgrade
        #  • proxy_set_header Upgrade     — passes the WS upgrade request
        #  • proxy_set_header Connection  — uses the map above (upgrade/close)
        #  • proxy_read_timeout 3600s     — keeps WS alive for 1 full hour
        #    without this, Nginx closes idle connections after 60s default,
        #    causing the bus marker to "freeze" on the parent's map
        #  • proxy_send_timeout 3600s     — same for server→client direction
        # ══════════════════════════════════════════════════════════════════
        location /ws/ {
            proxy_pass          http://api_backend;
            proxy_http_version  1.1;

            # WebSocket upgrade handshake headers — MUST be present
            proxy_set_header    Upgrade     $http_upgrade;
            proxy_set_header    Connection  $connection_upgrade;

            # Forwarding headers
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            # ▼ THE KEY SETTINGS — prevent bus tracking from freezing ▼
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            # ▲ ─────────────────────────────────────────────────────── ▲

            proxy_connect_timeout  10s;
            proxy_buffering        off;   # disable buffering for real-time frames

            # No rate limiting on WS — connections are long-lived
        }

        # ══════════════════════════════════════════════════════════════════
        #  GPS ingestion — rate limited to 20 req/s
        # ══════════════════════════════════════════════════════════════════
        location /api/gps-update {
            limit_req    zone=gps_limit  burst=50  nodelay;
            limit_req_status 429;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # ══════════════════════════════════════════════════════════════════
        #  OTP endpoints — strict rate limit (anti-spam / brute force)
        # ══════════════════════════════════════════════════════════════════
        location ~ ^/api/auth/otp/ {
            limit_req    zone=otp_limit  burst=5  nodelay;
            limit_req_status 429;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Telegram webhook — internal only, validated by app secret
        # ══════════════════════════════════════════════════════════════════
        location /api/telegram/webhook {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ══════════════════════════════════════════════════════════════════
        #  General API — /api/*
        # ══════════════════════════════════════════════════════════════════
        location /api/ {
            limit_req    zone=api_limit  burst=200  nodelay;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";   # keep-alive to upstream
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering    on;
            proxy_buffer_size  8k;
            proxy_buffers      8 8k;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Health check (no rate limit, no auth, no logs)
        # ══════════════════════════════════════════════════════════════════
        location = /health {
            proxy_pass         http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Static pages (App Store required URLs)
        # ══════════════════════════════════════════════════════════════════
        location /privacy {
            root       /var/www/static;
            try_files  /privacy.html =404;
            add_header Cache-Control "public, max-age=86400";
        }

        location /support {
            root       /var/www/static;
            try_files  /support.html =404;
            add_header Cache-Control "public, max-age=86400";
        }

        # ── Let's Encrypt renewal (for future production SSL setup) ───────────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Block common scan paths ───────────────────────────────────────────
        location ~ /\.(env|git|svn) {
            deny all;
            return 404;
        }
    }
}
