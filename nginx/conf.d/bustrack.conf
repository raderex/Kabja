# nginx/conf.d/bustrack.conf
# Kathmandu Bus Tracker — production Nginx config
# Handles: HTTPS termination, WS upgrade, App Store required pages

upstream api_backend {
    server api:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name bustrack.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/bustrack.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bustrack.yourdomain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ── REST API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # ── WebSocket upgrade ────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # 1 hour keepalive for active routes
        proxy_send_timeout 3600s;
    }

    # ── App Store required: Privacy Policy ───────────────────────────────
    location /privacy {
        root /var/www/static;
        try_files /privacy.html =404;
        add_header Content-Type "text/html; charset=utf-8";
    }

    # ── App Store required: Support page ─────────────────────────────────
    location /support {
        root /var/www/static;
        try_files /support.html =404;
        add_header Content-Type "text/html; charset=utf-8";
    }

    # ── Health check (load balancer probe) ───────────────────────────────
    location /health {
        proxy_pass http://api_backend/health;
        access_log off;
    }
}
